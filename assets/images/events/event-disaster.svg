<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" role="img" aria-labelledby="ds-title ds-desc">
  <title id="ds-title">山岳大災害</title>
  <desc id="ds-desc">稲妻が裂け、溶岩を噴き上げながら崩壊する巨大な山</desc>
  <defs>
    <linearGradient id="ds-sky" x1="27" y1="5" x2="213" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172536"/>
      <stop offset="0.46" stop-color="#171522"/>
      <stop offset="1" stop-color="#080A0F"/>
    </linearGradient>
    <linearGradient id="ds-mountain" x1="114" y1="48" x2="115" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#59636B"/>
      <stop offset="0.4" stop-color="#303942"/>
      <stop offset="1" stop-color="#101720"/>
    </linearGradient>
    <linearGradient id="ds-lava" x1="121" y1="53" x2="125" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0A0"/>
      <stop offset="0.22" stop-color="#FFB13E"/>
      <stop offset="0.62" stop-color="#EB542D"/>
      <stop offset="1" stop-color="#7D171D"/>
    </linearGradient>
    <linearGradient id="ds-lightning" x1="39" y1="8" x2="80" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8FAFF"/>
      <stop offset="0.55" stop-color="#8FDFFF"/>
      <stop offset="1" stop-color="#6B7CFF"/>
    </linearGradient>
    <radialGradient id="ds-eruption" cx="0" cy="0" r="1" gradientTransform="translate(124 72) rotate(90) scale(61 86)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBC45" stop-opacity="0.85"/>
      <stop offset="0.42" stop-color="#D53D2E" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4D1A28" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ds-smoke" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="ds-frame"><rect width="240" height="180" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#ds-frame)">
    <rect width="240" height="180" fill="url(#ds-sky)"/>
    <ellipse cx="124" cy="73" rx="84" ry="58" fill="url(#ds-eruption)" filter="url(#ds-smoke)"/>
    <path d="M0 104 30 75l20 19 29-41 27 43 25-30 36 36 27-39 46 46v71H0Z" fill="#1A2530" opacity="0.72"/>
    <path d="M0 125 36 91l24 30 29-27 28 31 39-42 30 38 22-18 32 29v48H0Z" fill="#0A1119"/>

    <!-- Forked lightning -->
    <path d="m54 3-8 31 13-2-14 31 17-10-8 32 31-47-17 7 12-27-15 5L73 3Z" fill="#0B1018" stroke="#0B1018" stroke-width="8" stroke-linejoin="round"/>
    <path d="m54 3-6 27 14-4-12 25 18-9-9 26 22-34-16 6 11-22-15 4 8-19Z" fill="url(#ds-lightning)" filter="url(#ds-glow)"/>
    <path d="m188 9-8 23 11-3-8 18 11-5-7 20 21-29-12 4 8-18-10 3 5-13Z" fill="#B9EFFF" opacity="0.9" filter="url(#ds-glow)"/>

    <!-- Eruption plume -->
    <g fill="#20232B" stroke="#0B0D12" stroke-width="3">
      <path d="M90 68c-8-12 1-24 15-22 2-16 21-22 32-11 11-10 30-1 27 15 17 0 21 18 8 27-17 11-66 8-82-9Z"/>
      <path d="M105 44c-2-13 10-24 22-18 7-14 28-9 29 7 11-3 21 8 16 18Z" fill="#2B2931"/>
    </g>
    <path d="M102 61c15-12 34-13 54-2" fill="none" stroke="#D95332" stroke-width="4" opacity="0.7"/>
    <g fill="#FFB544" filter="url(#ds-glow)">
      <circle cx="108" cy="43" r="3"/><circle cx="137" cy="28" r="2.5"/><circle cx="156" cy="51" r="2"/><circle cx="94" cy="57" r="2"/>
    </g>
    <path d="m114 63-9-34 14 24 6-39 8 39 16-25-8 39Z" fill="#FF9C32" opacity="0.9" filter="url(#ds-glow)"/>

    <!-- Collapsing mountain -->
    <path d="M24 172 75 125l16-22 17-18 14-26 17 23 16 21 13 25 50 44Z" fill="#080C12" stroke="#07090D" stroke-width="8" stroke-linejoin="round"/>
    <path d="m30 172 49-44 14-22 17-17 13-25 14 22 15 19 12 27 46 40Z" fill="url(#ds-mountain)" stroke="#17212B" stroke-width="3" stroke-linejoin="round"/>
    <path d="m78 130 32-41 13-25 14 22 15 19-16 3-10-12-12 20-14-8-8 24Z" fill="#899297"/>
    <path d="m83 124 10-18 7 7 14-24 9-25-16 21-17 18Z" fill="#C1C7C6" opacity="0.6"/>
    <path d="m53 172 27-35 13 5 11-22 16 8 9-25 16 16 12-3 30 56Z" fill="#1B252D"/>

    <!-- Molten fractures -->
    <path d="m123 67 8 23-8 15 10 15-7 14 9 14-4 24h-18l6-24-10-14 8-16-9-14 10-15Z" fill="#1A0D0D" stroke="#120A0B" stroke-width="8" stroke-linejoin="round"/>
    <path d="m123 68 4 22-8 15 9 15-7 14 9 15-4 23h-9l6-24-9-14 8-16-9-14 10-15Z" fill="url(#ds-lava)" filter="url(#ds-glow)"/>
    <path d="m116 119-20 15-11 20m44-34 20 9 16 25m-46-49-19-11-13 5" fill="none" stroke="#1A0D0D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m116 119-20 15-11 20m44-34 20 9 16 25m-46-49-19-11-13 5" fill="none" stroke="#F27131" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#ds-glow)"/>

    <!-- Falling rock debris -->
    <g fill="#4A3D38" stroke="#0A0C10" stroke-width="3">
      <path d="m68 86 9-8 9 7-4 12-12 1Z"/>
      <path d="m172 76 12-5 8 10-8 12-13-5Z"/>
      <path d="m193 105 8-4 7 7-4 9-10-2Z"/>
      <path d="m49 112 8-4 7 6-3 9-10 1Z"/>
      <path d="m153 93 7-4 6 6-3 8-9-1Z"/>
    </g>
    <path d="M0 158c38-11 67 4 96 7 36 4 66-10 94-8 18 1 34 6 50 13v10H0Z" fill="#080B0F" opacity="0.86"/>
    <path d="M4 174h232" stroke="#F06D31" stroke-width="2" opacity="0.65"/>
    <rect x="1.5" y="1.5" width="237" height="177" rx="10.5" fill="none" stroke="#563D43" stroke-width="3"/>
  </g>
</svg>
