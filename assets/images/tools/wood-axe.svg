      <stop offset="0.45" stop-color="#7A4728"/>
      <stop offset="1" stop-color="#2F2721"/>
    </linearGradient>
    <linearGradient id="wood-axe-head" x1="113" y1="51" x2="195" y2="101" gradientUnits="userSpaceOnUse">
