      <stop offset="0.53" stop-color="#09151E"/>
      <stop offset="1" stop-color="#04080C"/>
    </linearGradient>
    <linearGradient id="wood-axe-handle" x1="126" y1="66" x2="89" y2="164" gradientUnits="userSpaceOnUse">
