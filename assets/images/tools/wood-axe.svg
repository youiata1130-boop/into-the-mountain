<svg width="240" height="180" viewBox="0 0 240 180" role="img" aria-labelledby="wood-axe-title wood-axe-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="wood-axe-title">Wood-handled mountain axe</title>
  <desc id="wood-axe-desc">A broad dark axe head is lashed to a carved timber haft before jagged peaks, lit by amber sparks and cold teal mist.</desc>
