<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" role="img" aria-labelledby="sw-title sw-desc">
  <title id="sw-title">山塞の剣士</title>
  <desc id="sw-desc">冷たい山霧の中、琥珀色に縁取られた鎧と長剣を構える剣士</desc>
  <defs>
    <linearGradient id="sw-bg" x1="19" y1="4" x2="221" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172C3B"/>
      <stop offset="0.55" stop-color="#0B1623"/>
      <stop offset="1" stop-color="#060B12"/>
    </linearGradient>
    <linearGradient id="sw-armor" x1="70" y1="67" x2="147" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A6BDC0"/>
      <stop offset="0.28" stop-color="#536D75"/>
      <stop offset="0.62" stop-color="#293B47"/>
      <stop offset="1" stop-color="#131D29"/>
    </linearGradient>
    <linearGradient id="sw-blade" x1="143" y1="138" x2="203" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#526C73"/>
      <stop offset="0.42" stop-color="#E5F2EE"/>
      <stop offset="0.7" stop-color="#86A7A8"/>
      <stop offset="1" stop-color="#F4C26A"/>
    </linearGradient>
    <linearGradient id="sw-cloak" x1="50" y1="101" x2="89" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#315D60"/>
      <stop offset="1" stop-color="#142B35"/>
    </linearGradient>
    <radialGradient id="sw-backlight" cx="0" cy="0" r="1" gradientTransform="translate(158 47) rotate(127) scale(86 91)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDA047" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#DDA047" stop-opacity="0"/>
    </radialGradient>
    <filter id="sw-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="sw-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sw-frame"><rect width="240" height="180" rx="12"/></clipPath>
  </defs>
