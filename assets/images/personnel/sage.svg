<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" role="img" aria-labelledby="sg-title sg-desc">
  <title id="sg-title">蒼紫の賢者</title>
  <desc id="sg-desc">山岳の夜、杖と掌に青紫の魔力を宿す老賢者</desc>
  <defs>
    <linearGradient id="sg-bg" x1="20" y1="4" x2="218" y2="178" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17283A"/>
      <stop offset="0.52" stop-color="#0A1425"/>
      <stop offset="1" stop-color="#080B17"/>
    </linearGradient>
    <linearGradient id="sg-robe" x1="83" y1="89" x2="137" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#594E8E"/>
      <stop offset="0.45" stop-color="#283F65"/>
      <stop offset="1" stop-color="#111B33"/>
    </linearGradient>
    <linearGradient id="sg-skin" x1="101" y1="45" x2="132" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DAB28C"/>
      <stop offset="0.58" stop-color="#996958"/>
      <stop offset="1" stop-color="#523B48"/>
    </linearGradient>
    <linearGradient id="sg-staff" x1="181" y1="22" x2="163" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C28A47"/>
      <stop offset="0.45" stop-color="#73502F"/>
      <stop offset="1" stop-color="#2F231F"/>
    </linearGradient>
    <radialGradient id="sg-magic" cx="0" cy="0" r="1" gradientTransform="translate(61 117) rotate(90) scale(34)" gradientUnits="userSpaceOnUse">
