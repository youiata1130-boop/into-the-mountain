      <stop offset="0.3" stop-color="#6CA9FF"/>
      <stop offset="0.7" stop-color="#7457DF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#251C77" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sg-orb" cx="0" cy="0" r="1" gradientTransform="translate(181 32) rotate(90) scale(25)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F6FF"/>
      <stop offset="0.3" stop-color="#75CEFF"/>
      <stop offset="0.67" stop-color="#7659E4"/>
      <stop offset="1" stop-color="#271B70" stop-opacity="0"/>
    </radialGradient>
    <filter id="sg-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="sg-frame"><rect width="240" height="180" rx="12"/></clipPath>
  </defs>
