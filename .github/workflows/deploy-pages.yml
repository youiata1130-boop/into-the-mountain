name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate game files
        shell: bash
        run: |
          test -f index.html
          test -f src/game/state.js
          test -f src/ui/app.js
          test -f src/ui/styles.css
          test "$(find assets/images -type f -name '*.svg' | wc -l)" -eq 16
          node --check src/game/state.js
          node --check src/ui/app.js

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html LICENSE _site/
          cp -R assets src _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
